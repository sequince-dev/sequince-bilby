[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sequince-bilby"
authors = [
    {name = "Michael J. Williams", email = "michaeljw1@googlemail.com"},
]
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Upstream main uses the newer API but reports a 2.8 development version.
    "bilby>=2.8.0.dev0",
    "numpy",
    "orng>=0.2.1",
    "pandas",
    "sequince>=0.1.0b1",
]

dynamic = ["version"]

[tool.setuptools_scm]

[dependency-groups]
test = [
    "pytest>=7.0",
    "h5py>=3",
]
lint = [
    "pre-commit",
    "ruff==0.14.*",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[project.entry-points."bilby.samplers"]
sequince-smc = "sequince_bilby.plugin:SequinceSMC"
sequince-ps = "sequince_bilby.plugin:SequincePersistentSampling"

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

# Pixi reuses project dependencies and dependency groups above.
[tool.pixi.workspace]
channels = ["conda-forge"]
requires-pixi = ">=0.78"
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
sequince-bilby = { path = ".", editable = true }
# Opt Sequince's transitive dependency into prerelease resolution in Pixi.
minipcn = ">=0.3.0a1"

[tool.pixi.environments]
default = { features = ["py313", "test", "lint"], solve-group = "py313" }
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = { features = ["py313", "test"], solve-group = "py313" }
bilby28 = ["py313", "test", "bilby28"]
bilby-main = ["py313", "test", "lint", "bilby-main"]

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.test.tasks]
test = "python -m pytest"

[tool.pixi.feature.lint.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."

[tool.pixi.feature.bilby28.pypi-dependencies]
bilby = ">=2.8,<3.0"

[tool.pixi.feature.bilby-main.pypi-dependencies]
bilby = { git = "https://github.com/bilby-dev/bilby.git", rev = "main" }
jax = "*"

[tool.pixi.feature.bilby-main.activation.env]
BILBY_ARRAY_API = "1"
SCIPY_ARRAY_API = "1"
JAX_ENABLE_X64 = "1"

[tool.pixi.feature.bilby-main.tasks]
example-backends = "python examples/bilby_array_backends.py"
