[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sequince-bilby"
authors = [
    {name = "Michael J. Williams", email = "michaeljw1@googlemail.com"},
]
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "bilby>=2.7.0",
    "numpy",
    "pandas",
    "sequince",
]

dynamic = ["version"]

[tool.setuptools_scm]

[dependency-groups]
test = [
    "pytest>=7.0",
]

[project.entry-points."bilby.samplers"]
sequince-smc = "sequince_bilby.plugin:SequinceSMC"
sequince-ps = "sequince_bilby.plugin:SequincePersistentSampling"

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]
