name: Lint

on:
  push:
    branches: [ main, release* ]
  pull_request:
    branches: [ main, release* ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.14.x"
          args: 'check .'
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.14.x"
          args: 'format --check'
